version: '3'
services:
  bi4j-coordinator:
    image: bi4j
    restart: always
    container_name: bi4j-coordinator
    ports:
      - "8080:8080"
    environment:
      - BI4J_JVM_ARGS_EXTRA=-Xmx1g -Djava.net.preferIPv4Stack=true
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1"
    command:
      - cluster-coordinator
      - --threads=2
      - --worker-count=8
      - tjake/Mistral-7B-Instruct-v0.3-jlama-Q4
    volumes:
      - "./models:/models"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ui/index.html"]
      interval: 5s
  bi4j-worker:
    image: bi4j
    restart: always
    depends_on: 
      bi4j-coordinator:
        condition: service_healthy
    environment:
      - BI4J_JVM_ARGS_EXTRA=-Xmx500M -Djava.net.preferIPv4Stack=true -Dbi4j.use_hostname_as_workerid=true
    deploy:
      mode: replicated
      replicas: 8
      resources:
        limits:
          cpus: "1"
          memory: 500m
    command:
      - cluster-worker
      - --threads=1
      - --coordinator=bi4j-coordinator
      - tjake/Mistral-7B-Instruct-v0.3-jlama-Q4
    volumes:
      - "./models:/models"
