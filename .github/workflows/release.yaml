name: Release

# Release MANUAL: so roda quando alguem dispara o workflow na aba Actions e informa a versao.
# Publica no GitHub Packages (https://maven.pkg.github.com/bitubi-solutions/bitubi-inference-4j).
# Limitacao: o job publica o classificador do Linux (linux-x86_64) do bitubi-inference-4j-native.
# Os classificadores de macOS e Windows ainda nao sao publicados (nao verificado se o GitHub Packages
# aceita republicar o mesmo POM e JAR principal a partir de outro job).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versao a publicar (ex.: 0.1.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          mvn-toolchain-vendor: Eclipse Adoptium
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -DskipTests -Prelease -Drevision=${{ inputs.version }} deploy
